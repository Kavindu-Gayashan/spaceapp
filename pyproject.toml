[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orbital-pulse"
version = "1.0.0"
description = "NASA Space Apps Challenge 2026 - Orbital Pulse"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "websockets>=12.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "pydantic>=2.7.0",
    "aiofiles>=23.2.0"
]

[tool.vercel]
entrypoint = "main:app"
